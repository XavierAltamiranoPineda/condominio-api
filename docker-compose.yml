# ═══════════════════════════════════════════════════════════════
#  docker-compose.yml — PostgreSQL para desarrollo local
#
#  Uso:
#    docker compose up -d          → levantar
#    docker compose down           → detener
#    docker compose down -v        → detener y borrar datos
# ═══════════════════════════════════════════════════════════════

services:

  postgres:
    image: postgres:16-alpine
    container_name: condominio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: condominio_db
      POSTGRES_USER: condominio_user
      POSTGRES_PASSWORD: condominio_pass
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U condominio_user -d condominio_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── pgAdmin (opcional, para administrar la BD visualmente) ──
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: condominio_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@condominio.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
    name: condominio_postgres_data
  pgadmin_data:
    name: condominio_pgadmin_data
