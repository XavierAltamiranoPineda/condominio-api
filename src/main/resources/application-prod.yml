# ═══════════════════════════════════════════════════════════════
#  application-prod.yml — Perfil de producción
#  TODAS las credenciales se leen de variables de entorno.
#  Activa con: -Dspring.profiles.active=prod
# ═══════════════════════════════════════════════════════════════
spring:

  # ── Base de datos (valores desde variables de entorno) ─────
  datasource:
    url: ${DB_URL}                    # jdbc:postgresql://host:5432/condominio_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ── JPA / Hibernate ─────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  # ── Flyway ──────────────────────────────────────────────────
  flyway:
    url: ${DB_URL}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}

# ── Servidor ────────────────────────────────────────────────
server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never

# ── Logging ─────────────────────────────────────────────────
logging:
  level:
    root: WARN
    com.condominio: INFO
    org.springframework.security: WARN

# ── JWT ─────────────────────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET}             # Obligatorio: mínimo 256 bits
    access-token-expiration-ms: ${JWT_ACCESS_EXP:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXP:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

# ── SpringDoc — Configurable en producción ──────────────────
springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
